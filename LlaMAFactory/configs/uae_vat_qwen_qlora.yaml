### UAE VAT assistant — QLoRA fine-tune with LLaMA-Factory
### Run:  llamafactory-cli train configs/uae_vat_qwen_qlora.yaml
### Small base + 4-bit QLoRA: fits a free Colab T4; comfortable on your A100.

### model
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct   # or meta-llama/Llama-3.2-3B-Instruct
quantization_bit: 4                               # QLoRA (NF4)
quantization_method: bitsandbytes
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### dataset
dataset: uae_vat
dataset_dir: data           # folder containing dataset_info.json + uae_vat_alpaca.json
template: qwen              # use "llama3" if you switch to a Llama-3.x base
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: saves/uae-vat-qwen1.5b-lora
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true
report_to: wandb            # set to none to disable W&B

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8     # effective batch 16
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true                  # set fp16: true instead on a T4 (no real bf16)

